name: Build Windows package

# 云端生成 Windows 10/11 x64 便携包（ZIP），本机不用装 Flutter / Go / MinGW / VS。
# 用法：Actions 页面左侧选本工作流 → Run workflow → 跑完在运行页底部下载 Artifact。
# 产出：hongguojian-<版本>-windows-x64.zip / zhenguojian-<版本>-windows-x64.zip + SHA256SUMS.txt
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '同时上传到 GitHub Release（不勾选则只保留 Actions Artifact）'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      # Go 的 c-shared DLL 需要 x64 MinGW 编译器。
      # 不用 egor-tensin/setup-mingw@v2：它会在收尾时删除 libpthread.dll.a，
      # 而 mingw 16.2.0 起不再提供该文件，导致整步退出 1。
      - name: 安装 MinGW-w64
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          $bin = Get-ChildItem 'C:\ProgramData\mingw64\*\bin' -Directory -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $bin) { throw '未找到 MinGW 的 bin 目录' }
          $bin >> $env:GITHUB_PATH
          Write-Host "MinGW bin: $bin"
          $gcc = Join-Path $bin 'x86_64-w64-mingw32-gcc.exe'
          if (Test-Path $gcc) { & $gcc --version | Select-Object -First 1 } else { Write-Warning "未找到 $gcc" }

      # 上游 shinchiro/mpv-winbuild-cmake 会滚动删除旧 release，写死的日期迟早 404。
      # 这里在构建前动态取「当前最新的 mpv-dev-x86_64 资产」的日期/git提交/SHA256，
      # 再对仓库里 CMakeLists.txt 的三处硬编码做临时替换，避免过期。
      - name: 解析最新 libmpv 资产
        id: libmpv
        shell: pwsh
        run: |
          $releases = Invoke-RestMethod -Uri 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases?per_page=1' -Headers @{ 'User-Agent' = 'actions' }
          $tag = $releases[0].tag_name
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/tags/$tag" -Headers @{ 'User-Agent' = 'actions' }
          $asset = $rel.assets | Where-Object {
            $_.name -like 'mpv-dev-x86_64-*.7z' -and $_.name -notlike '*-v3-*'
          } | Select-Object -First 1
          if (-not $asset) { throw "未找到 mpv-dev-x86_64 资产（tag=$tag）" }
          $name = $asset.name
          $sha256 = $asset.digest -replace '^sha256:', ''
          $commit = ($name -split '-git-')[1] -replace '\.7z$', ''
          if (-not $sha256) { throw '资产缺少 digest，无法取得 SHA256' }
          Write-Host "最新 libmpv：$name"
          Write-Host "SHA256：$sha256"

          $cmake = 'packages\media_kit_libs_windows_video\windows\CMakeLists.txt'
          $text = Get-Content $cmake -Raw

          # 顺序很重要：先把 SHA256 按「旧文件名行正下方」定位替换掉，
          # 再替换文件名和 URL。这样能精确定位 libmpv，不误伤 ANGLE 的 SHA256。
          # 1) SHA256 —— 匹配旧 mpv 文件名行紧邻下一行的 64 位 hex
          $pattern = '(?s)(mpv-dev-x86_64-\d{8}-git-[0-9a-f]+\.7z"\s*\r?\n\s*")[0-9a-f]{64}(")'
          $text = [regex]::Replace($text, $pattern, '${1}' + $sha256 + '${2}')
          # 2) 文件名里的日期和 git 提交
          $text = $text -replace 'mpv-dev-x86_64-\d{8}-git-[0-9a-f]+\.7z', $name
          # 3) 下载 URL
          $text = $text -replace 'https://github\.com/shinchiro/mpv-winbuild-cmake/releases/download/[^"]+', "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$tag/$name"

          if ($text -notmatch [regex]::Escape($name)) { throw 'CMakeLists.txt 文件名替换失败' }
          if ($text -notmatch [regex]::Escape($sha256)) { throw 'CMakeLists.txt SHA256 替换失败' }

          Set-Content -Path $cmake -Value $text -NoNewline
          Write-Host 'CMakeLists.txt 已更新为最新 libmpv 资产'
          "name=$name" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT

      # 编译 Go 核心 → flutter build windows → 打 dist\windows\*.zip 并写 SHA256SUMS.txt
      - name: 构建 Windows ZIP
        run: python scripts/build_windows.py ${{ matrix.arguments }}

      # mingw 是 posix 线程模型，cgo 编出的 DLL 会动态依赖 libwinpthread-1.dll；
      # 该文件不在 Flutter 的 Release 目录里，运行时缺它会直接加载失败，这里补齐后重打 ZIP。
      - name: 补齐 MinGW 运行时 DLL
        shell: pwsh
        run: |
          $release = (Resolve-Path 'build\windows\x64\runner\Release').Path
          $core = Join-Path $release 'duanju_core.dll'
          $objdump = Get-Command 'x86_64-w64-mingw32-objdump.exe' -ErrorAction SilentlyContinue
          if (-not $objdump) { throw '未找到 objdump，无法检查 DLL 依赖' }

          $imports = & $objdump.Source -p $core |
                     Select-String 'DLL Name:\s*(\S+)' |
                     ForEach-Object { $_.Matches[0].Groups[1].Value } |
                     Sort-Object -Unique
          Write-Host "duanju_core.dll 依赖：$($imports -join ', ')"

          $copied = @()
          foreach ($dll in $imports) {
            if (Test-Path (Join-Path $release $dll)) { continue }
            $source = Get-ChildItem 'C:\ProgramData\mingw64\*\bin' -Filter $dll -ErrorAction SilentlyContinue |
                      Select-Object -First 1
            if ($source) {
              Copy-Item $source.FullName $release
              $copied += $dll
              Write-Host "已补齐 $dll"
            } else {
              Write-Warning "$dll 既不在 Release 目录也不在 MinGW 目录，运行可能失败"
            }
          }

          if ($copied) {
            python scripts/package_release.py --platform windows ${{ matrix.arguments }}
          } else {
            Write-Host '无需补齐，ZIP 保持原样'
          }

      - name: 确认产物
        shell: pwsh
        run: |
          Get-ChildItem dist\windows | Format-Table Name, Length
          if (-not (Get-ChildItem dist\windows -Filter '*.zip')) { throw '没有生成 ZIP' }
          Get-Content dist\windows\SHA256SUMS.txt

      # 解压 ZIP 后真实启动一次应用；失败只记日志，不影响已生成的包
      - name: 冒烟检查（非阻断）
        continue-on-error: true
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          $env:PATH = 'C:\ProgramData\chocolatey\bin;' + $env:PATH
          python scripts/smoke_windows.py ${{ matrix.arguments }}

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('dist/windows/*') != ''
        with:
          name: ${{ matrix.edition }}-windows
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: windows
    if: inputs.publish_release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-windows'
          path: assets

      - name: 汇总产物
        run: |
          set -euo pipefail
          mkdir -p out
          for dir in assets/*/; do
            edition="$(basename "$dir")"
            edition="${edition%-windows}"
            for file in "$dir"*; do
              name="$(basename "$file")"
              if [ "$name" = "SHA256SUMS.txt" ]; then
                cp "$file" "out/SHA256SUMS-$edition.txt"
              else
                cp "$file" out/
              fi
            done
          done
          ls -lh out

      - name: 创建 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="windows-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --title "秋秋短剧 Windows 便携包 $tag" \
            --notes "由 GitHub Actions 运行 [$GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) 生成。解压后运行 hongguojian.exe / zhenguojian.exe，保持所有 DLL 和 data 目录在同一层。" \
            out/*
